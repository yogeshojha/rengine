# the api's own secrets, blanked everywhere else
x-api-only: &api-only
  ADMIN_PASSWORD: ""
  JWT_SECRET_KEY: ""

# chromium's namespace sandbox
x-chromium-sandbox: &chromium-sandbox
  - seccomp=./deploy/seccomp-chromium.json

x-worker-volumes: &worker-volumes
  - ./worker/app:/app/app
  - ./shared:/app/shared
  - ./tools:/app/tools
  - ./stages:/app/stages
  - ./reports:/app/reports
  - ./interest:/app/interest
  - ./toolbox:/app/toolbox
  - ./scan_media:/app/scan_media
  - vuln_templates:/app/vuln-templates
  - wordlists:/app/wordlists
  - reports_out:/app/reports-out
  - exports_out:/app/exports-out
  - report_fonts:/app/report-fonts
  # keep the image's editable installs
  - /app/shared/build
  - /app/shared/rengine_shared.egg-info
  - /app/tools/build
  - /app/tools/rengine_tools.egg-info

services:
  db:
    image: postgres:16-alpine
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rengine}
      POSTGRES_DB: ${POSTGRES_DB:-rengine}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5432:5432"
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}
      -c work_mem=${POSTGRES_WORK_MEM:-32MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_parallel_workers_per_gather=4
      -c jit=off
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-250}
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=5000
      -c pg_stat_statements.track=top
      -c track_io_timing=on
      -c log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION:-2000}
      -c max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
      -c min_wal_size=512MB
      -c checkpoint_timeout=15min
      -c wal_compression=lz4
      -c default_toast_compression=lz4
    # a fast shutdown writes a checkpoint first
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rengine}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} --no-auth-warning ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy noeviction
      ${REDIS_PASSWORD:+--requirepass} ${REDIS_PASSWORD:-}

  # cached aggregates, evicted under memory pressure
  cache:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} --no-auth-warning ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory ${REDIS_CACHE_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass} ${REDIS_PASSWORD:-}

  api:
    image: rengine-api:latest
    build:
      context: .
      dockerfile: api/Dockerfile
      target: development
    volumes:
      - ./api/app:/app/app
      - ./shared:/app/shared
      - ./tools:/app/tools
      - ./stages:/app/stages
      - ./reports:/app/reports
      - ./interest:/app/interest
      - ./mcp:/app/mcp
      - ./channels:/app/channels
      - ./connectors:/app/connectors
      - ./toolbox:/app/toolbox
      - ./binaries:/app/binaries:ro
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      # frontend mirrors for the drift tests
      - ./frontend/src/lib/config:/app/frontend-config:ro
      - ./scan_media:/app/scan_media
      - vuln_templates:/app/vuln-templates
      - wordlists:/app/wordlists
      - reports_out:/app/reports-out
      - exports_out:/app/exports-out
      - report_fonts:/app/report-fonts
      - /app/shared/build
      - /app/shared/rengine_shared.egg-info
      - /app/tools/build
      - /app/tools/rengine_tools.egg-info
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment:
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      cache:
        condition: service_started

  # background jobs and toolbox runs
  worker-default:
    init: true
    image: rengine-worker:latest
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: development
    volumes: *worker-volumes
    env_file:
      - .env
    environment: *api-only
    security_opt: *chromium-sandbox
    command: >
      uv run celery -A app.celery worker
      --concurrency=${CELERY_DEFAULT_CONCURRENCY:-4}
      --queues=critical,default
      --hostname=worker-default@%h
      --without-mingle
      --without-gossip
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # scan stages, one slot per running stage
  worker-scans:
    init: true
    # built by worker-default
    image: rengine-worker:latest
    shm_size: 512m
    oom_score_adj: 500
    volumes: *worker-volumes
    env_file:
      - .env
    environment: *api-only
    security_opt: *chromium-sandbox
    command: >
      uv run celery -A app.celery worker
      --concurrency=${CELERY_SCAN_CONCURRENCY:-16}
      --queues=scans
      --hostname=worker-scans@%h
      --without-mingle
      --without-gossip
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # scan launch, step hand-over, resume and finalize
  worker-control:
    init: true
    # built by worker-default
    image: rengine-worker:latest
    volumes: *worker-volumes
    env_file:
      - .env
    environment: *api-only
    command: >
      uv run celery -A app.celery worker
      --concurrency=${CELERY_CONTROL_CONCURRENCY:-8}
      --queues=scan_control
      --hostname=worker-control@%h
      --without-mingle
      --without-gossip
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # beat scheduler
  worker-beat:
    init: true
    # built by worker-default
    image: rengine-worker:latest
    volumes:
      - ./worker/app:/app/app
      - ./shared:/app/shared
      - ./tools:/app/tools
      - ./stages:/app/stages
      - ./reports:/app/reports
      - ./interest:/app/interest
      - ./toolbox:/app/toolbox
      - beat_state:/app/beat-state
      - /app/shared/build
      - /app/shared/rengine_shared.egg-info
      - /app/tools/build
      - /app/tools/rengine_tools.egg-info
    env_file:
      - .env
    environment: *api-only
    command: uv run celery -A app.celery beat
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # certificate transparency stream for watched programs
  ct-stream:
    init: true
    # built by worker-default
    image: rengine-worker:latest
    volumes:
      - ./worker/app:/app/app
      - ./shared:/app/shared
      - ./tools:/app/tools
      - ./stages:/app/stages
      - ./reports:/app/reports
      - ./interest:/app/interest
      - ./toolbox:/app/toolbox
      - ct_state:/app/ct-state
      - /app/shared/build
      - /app/shared/rengine_shared.egg-info
      - /app/tools/build
      - /app/tools/rengine_tools.egg-info
    env_file:
      - .env
    environment: *api-only
    command: uv run python -m app.ct_stream
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # remote control: long-polls every chat channel that is switched on
  channels:
    init: true
    # built by api
    image: rengine-api:latest
    volumes:
      - ./api/app:/app/app
      - ./shared:/app/shared
      - ./tools:/app/tools
      - ./stages:/app/stages
      - ./reports:/app/reports
      - ./interest:/app/interest
      - ./mcp:/app/mcp
      - ./channels:/app/channels
      - ./connectors:/app/connectors
      - ./toolbox:/app/toolbox
      - /app/shared/build
      - /app/shared/rengine_shared.egg-info
      - /app/tools/build
      - /app/tools/rengine_tools.egg-info
    env_file:
      - .env
    environment: *api-only
    command: uv run python -m channels
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  flower:
    # built by worker-default
    image: rengine-worker:latest
    volumes: *worker-volumes
    profiles: ["debug"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5555:5555"
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      uv run celery -A app.celery flower
      --port=5555
      --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:5173:5173"
    environment:
      - NODE_ENV=development
    depends_on:
      - api

volumes:
  beat_state:
  ct_state:
  postgres_data:
  redis_data:
  vuln_templates:
  wordlists:
  exports_out:
  reports_out:
  report_fonts:
