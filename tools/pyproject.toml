[project]
name = "rengine-tools"
version = "3.0.0"
requires-python = ">=3.13"
dependencies = [
    "requests[socks]>=2.32",
    "whoisit>=4.0.3",
]

[build-system]
requires = ["setuptools>=81.0"]
build-backend = "setuptools.build_meta"

# deps only: a packaged tools/httpx shadows the httpx library
[tool.setuptools]
packages = []
