[project]
name = "rengine-worker"
version = "3.0.0"
description = "reNgine Worker: Celery background tasks for reconnaissance"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.69.0",
    "apprise>=1.9.0",
    "brotli>=1.1.0",
    "celery[redis]>=5.6.2",
    "cryptography>=42",
    "httpx>=0.27",
    "jinja2>=3.1.4",
    "markdown-it-py>=3.0.0",
    "flower>=2.0.1",
    "psycopg2-binary>=2.9.11",
    "pyyaml>=6.0",
    "pydantic-settings>=2.12.0",
    "redis>=6.4.0",
    "sqlmodel>=0.0.32",
    "weasyprint>=66",
    "rengine-shared @ file:///app/shared",
    "rengine-tools @ file:///app/tools",
]
