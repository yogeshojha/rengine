[project]
name = "rengine-api"
version = "3.0.0"
description = "reNgine: FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.3",
    "anthropic>=0.69.0",
    "apprise>=1.9.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "brotli>=1.1.0",
    "fonttools>=4.59.2",
    "celery>=5.6.2",
    "cryptography>=42",
    "fastapi>=0.128.0",
    "fastapi-pagination>=0.15.8",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.12.0",
    "pyotp>=2.9.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.22",
    "qrcode[pil]>=7.4.2",
    "redis>=7.1.0",
    "sqlmodel>=0.0.31",
    "uvicorn>=0.40.0",
    "validators>=0.35.0",
    "pyyaml>=6.0",
    "zxcvbn>=4.5.0",
    "rengine-shared @ file:///app/shared",
    "rengine-tools @ file:///app/tools",
]
