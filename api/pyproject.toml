[project]
name = "rengine-api"
version = "3.0.0"
description = "reNgine: FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.3",
    "anthropic>=0.69.0",
    "anyio>=4.14.2",
    "apprise>=1.9.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "brotli>=1.2.1",
    "fonttools>=4.59.2",
    "celery[redis]>=5.6.2",
    "cryptography>=42",
    "fastapi>=0.128.0",
    "fastapi-pagination>=0.16.0",
    "httpx[socks]>=0.28",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.31",
    "qrcode[pil]>=7.4.2",
    "redis>=6.4.0",
    "sqlmodel>=0.0.31",
    "starlette>=1.3.1",
    "uvicorn>=0.40.0",
    "validators>=0.35.0",
    "pyyaml>=6.0",
    "zxcvbn>=4.5.0",
    "rengine-shared @ file:///app/shared",
    "rengine-tools @ file:///app/tools",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
