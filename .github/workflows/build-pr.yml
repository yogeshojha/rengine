name: 🏗️ Build Docker images for pull request

on:
  pull_request:
    branches:
      - master
      - release/*

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🐳 Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            arch: amd64
            runner: ubuntu-24.04
          - image: worker
            arch: amd64
            runner: ubuntu-24.04
          - image: worker
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: frontend
            arch: amd64
            runner: ubuntu-24.04
    steps:
      - name: 📥 Checkout the git repo
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          target: production
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
