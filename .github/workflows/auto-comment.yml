name: 💬 Auto Comment

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto_comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new issues and pull requests
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const { owner, repo } = context.repo;
            const author = context.payload.sender.login;
            const comment = (body) =>
              github.rest.issues.createComment({ issue_number: context.issue.number, owner, repo, body });

            if (context.eventName === 'issues') {
              const title = context.payload.issue.title.toLowerCase();
              if (title.includes('feat')) {
                await comment(
                  `Thanks for the request, @${author}.\n\n` +
                  `A feature request is quickest to act on when it names the problem it solves, ` +
                  `the surface it affects, and what the result should look like.\n\n` +
                  `Documentation: https://rengine.wiki`
                );
              } else {
                await comment(
                  `Thanks for the report, @${author}.\n\n` +
                  `A bug report is quickest to reproduce when it names the reNgine version, the steps ` +
                  `that trigger it, the expected result, the actual result, and the relevant log output.\n\n` +
                  `Documentation: https://rengine.wiki`
                );
              }
              return;
            }

            if (context.payload.action === 'opened') {
              await comment(`Thanks for the contribution, @${author}. A maintainer will review it.`);
              return;
            }

            if (context.payload.pull_request.merged) {
              await comment(`Merged. Thanks for the contribution, @${author}.`);
            } else {
              await comment(
                `Closed without merging. Thanks for the contribution, @${author}. ` +
                `The issue tracker is the place to raise the change again if it should be reconsidered.`
              );
            }
