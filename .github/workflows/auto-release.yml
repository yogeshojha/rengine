name: Update Version and Changelog and Readme

on:
  release:
    types: [published]

jobs:
  update-version-and-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest release info
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.setOutput('tag_name', release.data.tag_name);
            core.setOutput('body', release.data.body);

      # VERSION is the one version file (frontend/src/lib/version.ts imports
      # it). It holds the bare number, so a leading v on the tag is dropped.
      - name: Update version file
        env:
          TAG_NAME: ${{ steps.get_release.outputs.tag_name }}
        run: printf '%s\n' "${TAG_NAME#v}" > VERSION

      # the tag and the notes reach the shell as variables, never spliced into
      # the script, so a quote or backtick in the notes cannot break or run it
      - name: Update CHANGELOG.md
        env:
          TAG_NAME: ${{ steps.get_release.outputs.tag_name }}
          BODY: ${{ steps.get_release.outputs.body }}
        run: |
          echo "# Changelog" > CHANGELOG.md.new
          echo "" >> CHANGELOG.md.new
          echo "## $TAG_NAME" >> CHANGELOG.md.new
          echo "" >> CHANGELOG.md.new
          printf '%s\n' "$BODY" >> CHANGELOG.md.new
          echo "" >> CHANGELOG.md.new
          if [ -f CHANGELOG.md ]; then
            sed '1,2d' CHANGELOG.md >> CHANGELOG.md.new
          fi
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Update README.md
        env:
          TAG_NAME: ${{ steps.get_release.outputs.tag_name }}
        run: |
          sed -i "s|https://img.shields.io/badge/version-.*-informational|https://img.shields.io/badge/version-${TAG_NAME}-informational|g" README.md

      - name: Commit and push changes
        env:
          TAG_NAME: ${{ steps.get_release.outputs.tag_name }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add VERSION CHANGELOG.md README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "reNgine release: $TAG_NAME :rocket:"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
