name: Update Version and Changelog and Readme

on:
  release:
    types: [published]

jobs:
  update-version-and-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      BODY: ${{ github.event.release.body }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update version file
        run: printf '%s\n' "${TAG#v}" > VERSION

      - name: Update CHANGELOG.md
        run: |
          printf '%s\n' "# Changelog" "" "## $TAG" "" "$BODY" "" > CHANGELOG.md.new
          if [ -f CHANGELOG.md ]; then
            sed '1,2d' CHANGELOG.md >> CHANGELOG.md.new
          fi
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Update README.md
        run: |
          sed -i "s|https://img.shields.io/badge/version-.*-informational|https://img.shields.io/badge/version-$TAG-informational|g" README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add VERSION CHANGELOG.md README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "reNgine release: $TAG"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
