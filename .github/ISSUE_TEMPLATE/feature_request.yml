name: 🚀 Feature request
description: File a feature request
title: "feat: <title>"
labels: [feature_request]
body:
- type: checkboxes
  attributes:
    label: Is there an existing feature or issue for this?
    description: Search existing issues for the feature before opening a request.
    options:
    - label: I have searched the existing issues
      required: true
- type: textarea
  attributes:
    label: Expected feature
    description: A clear and concise description of what the problem is and how it could be approached.
  validations:
    required: true
- type: textarea
  attributes:
    label: Alternative solutions
    description: A clear and concise description of any alternative solutions or features you've considered.
  validations:
    required: false
- type: textarea
  attributes:
    label: Anything else?
    description: |
      Links, references or mockups related to the request.
  validations:
    required: false
