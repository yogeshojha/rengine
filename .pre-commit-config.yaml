repos:
  # Python specific - Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        name: ruff-fix
        args: [--fix, --exit-zero]
        files: ^(api|worker|shared|tools)/
      - id: ruff-format
        files: ^(api|worker|shared|tools)/
      - id: ruff
        name: ruff-check
        args: [--exit-non-zero-on-fix]
        files: ^(api|worker|shared|tools)/

  # Frontend Svelte - Prettier
  - repo: local
    hooks:
      - id: prettier
        name: prettier-format
        entry: bash -c 'cd frontend && npx prettier --write --ignore-unknown'
        language: system
        files: ^frontend/.*\.(js|ts|svelte|json|css|scss|html)$
        pass_filenames: true

  # General
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
